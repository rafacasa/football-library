{% extends "base.html" %}

{% block content %}

    <table class="table table-striped table-hover">
        <thead>
            <th scope="col">Name</th>

        </thead>
        <tbody>
            {% for league in leagues %}

                <td><a href="{% url "football:gamelist-by-league" league.slug %}" class="link-dark">{{ league.name }}</a></td>

            {% endfor %}
        </tbody>
    </table>

{% endblock content %}
